[package]
name = "rust_be"
version = "0.1.0"
edition = "2024"

[dependencies]
actix-web = "4.17.0"
chrono = { version = "0.4.45", features = ["serde"] }
reqwest = { version = "0.13.5", features = ["json", "query"] }
rust_decimal = { version = "1.43.0", features = ["serde"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
