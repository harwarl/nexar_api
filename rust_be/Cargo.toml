[package]
name = "rust_be"
version = "0.1.0"
edition = "2024"

[dependencies]
actix-web = "4.17.0"
chrono = { version = "0.4.45", features = ["serde"] }
dotenvy = "0.15.7"
reqwest = { version = "0.13.5", features = ["json", "query"] }
rust_decimal = { version = "1.43.0", features = ["serde", "serde-with-float"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
utoipa = { version = "6.0.0", features = ["actix_extras", "chrono", "decimal"] }
utoipa-swagger-ui = { version = "10.0.1", features = ["actix-web", "vendored"] }

[dev-dependencies]
wiremock = "0.6.5"
